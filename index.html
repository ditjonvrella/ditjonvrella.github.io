<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coaching</title><link rel="manifest" href="manifest.webmanifest?v=2.4.4"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#0D1117"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Coaching">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#0D1117; --surface:#151B23; --raised:#1D2530; --input:#1A222C; --line:#29323E;
  --fg:#E8EDF2; --muted:#8B97A6; --accent:#5FB0E8; --accent-ink:#06131E; --ideal:#B6A2F2;
  --good:#3FB37F; --warn:#E0B341; --bad:#E5605A; --none:#6B7785;
  --c-p:#E8799B; --c-kh:#5FB0E8; --c-f:#E0B341;
  --r:14px; --shadow:0 1px 0 rgb(255 255 255 / .03) inset,0 8px 24px -12px rgb(0 0 0 / .6);
  --f-head:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--f-head);margin:0;font-weight:600;text-wrap:balance} h1{font-size:22px} h2{font-size:17px} h3{font-size:14px}
.muted{color:var(--muted)} .small{font-size:12.5px} .err{color:var(--bad)} .okc{color:var(--good)} .warnc{color:var(--warn)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.num,td{font-variant-numeric:tabular-nums}
button{font:inherit;color:var(--fg);background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--muted)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
button.ghost{background:transparent} button.ic{padding:3px 8px;line-height:1.2} button.danger{color:var(--bad)} button.pri.danger{background:var(--bad);color:#fff}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;color:var(--fg);background:var(--input);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
textarea{width:100%;resize:vertical}
input:disabled,select:disabled{opacity:.55}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .sp{flex:1}
.stack{display:flex;flex-direction:column;gap:14px} .stack>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.fld{display:flex;flex-direction:column;gap:5px}
.fld input,.fld select{width:100%}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.scroll{overflow-x:auto;min-width:0}
table.t{border-collapse:collapse;width:100%}
.t th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.t td input,.t td select{width:100%}
.t tr.new td{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);background:color-mix(in srgb,var(--input) 55%,transparent)}
.t tr.cur td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.t tr.sum td{font-weight:600;background:var(--raised)}
.t tr.soll td{color:var(--muted);background:var(--raised)}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.t td.wrap{white-space:normal;min-width:140px}
.w-xs{width:62px!important} .w-s{width:84px!important} .w-m{width:130px!important} .w-l{width:200px!important}
.ok{color:var(--good)} .off{color:var(--warn)}
td.ok,span.ok{color:var(--good)} td.off,span.off{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--s) 18%,transparent);color:var(--s)}
.s-good{--s:var(--good)} .s-warn{--s:var(--warn)} .s-bad{--s:var(--bad)} .s-none{--s:var(--none)} .s-acc{--s:var(--accent)} .s-ideal{--s:var(--ideal)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 14px;z-index:50;box-shadow:0 10px 30px rgb(0 0 0 / .45);max-width:calc(100vw - 32px);display:flex;gap:12px;align-items:center}
.toast[hidden]{display:none} .toast .x{border:0;background:transparent;color:var(--muted);padding:2px 6px;font-size:16px;line-height:1}
/* Textfelder wachsen mit dem Inhalt (Chrome/Edge), damit man sieht, was man schreibt */
input.grow,textarea.grow{field-sizing:content} input.grow{min-width:130px;max-width:100%}
textarea.grow{min-height:34px;resize:none;line-height:1.35} .t td textarea.grow{width:100%;min-width:200px}
.t td input.grow{width:auto!important;min-width:160px}
.wrap-txt,.exc,.msg,.meal b{overflow-wrap:anywhere;word-break:break-word} .pre{white-space:pre-line}
.nd{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.nd .meal{background:var(--bg)} .tsep{width:1px;background:var(--line);margin:6px 6px}
.t tr.grp td{background:var(--raised);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding-top:8px}
.dests{display:flex;flex-direction:column;gap:6px} .dests button{text-align:left}
.banner{border:1px solid color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-radius:10px;padding:10px 14px}
.center{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid var(--c);vertical-align:middle;margin-right:5px}
.legend i.d{border-top-style:dashed} .legend i.b{width:10px;height:10px;border:0;border-radius:2px;background:var(--c)}
svg .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
/* Coach */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1400px;margin:0 auto;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--f-head);font-weight:700;font-size:16px}
.wrap{max-width:1400px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.cw{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.side{display:flex;flex-direction:column;gap:6px;position:sticky;top:64px}
.ath{display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;padding:9px 12px;background:var(--surface);white-space:normal}
.ath[aria-pressed="true"]{border-color:var(--accent);background:var(--raised)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted);padding:9px 12px}
.tabs button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:3px;border-top:3px solid var(--s,var(--line))}
.tile .v{font-family:var(--f-head);font-size:20px;font-weight:600}
.tile.ok{--s:var(--good)} .tile.off{--s:var(--warn)}
.tile.ok .v,.tile.off .v{color:var(--fg)}
.cyc{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));gap:6px}
.cyc>div{display:flex;flex-direction:column;gap:4px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.cyc select{width:100%;font-size:12.5px;padding:4px}
.ex{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;display:flex;flex-direction:column;gap:8px}
.ex.drag{opacity:.4} .ex.over{box-shadow:inset 0 3px 0 var(--accent)}
.ex-h{display:grid;grid-template-columns:28px 22px minmax(120px,170px) minmax(160px,1fr) 90px minmax(120px,1fr) auto;gap:6px;align-items:center}
.handle{cursor:grab;color:var(--muted);user-select:none;text-align:center}
.sets{display:grid;grid-template-columns:52px 90px 150px 70px auto;gap:4px 8px;align-items:center;padding-left:56px}
.meal{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.tot{display:flex;gap:16px;flex-wrap:wrap;font-size:13px} .tot b{font-family:var(--f-head);font-size:16px}
.ov{position:fixed;inset:0;background:rgb(0 0 0 / .6);display:grid;place-items:center;z-index:40;padding:16px}
.modal{width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto}
.modal.wide{max-width:880px}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;border-radius:0;background:transparent;color:var(--muted);padding:5px 10px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,var(--raised));color:var(--fg);font-weight:600}
.tl{display:flex;flex-direction:column;gap:10px}
.blk{border:1px solid var(--line);border-left:4px solid var(--s,var(--line));border-radius:10px;background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:10px}
.blk.st-run{--s:var(--accent)} .blk.st-plan{--s:var(--none)} .blk.st-done{--s:var(--good);opacity:.85}
.blk.pz{margin-left:28px;border-style:dashed;--s:var(--ideal)}
.blk.auto{border-style:dashed;--s:var(--good);padding:8px 12px}
.goal{display:flex;flex-direction:column;gap:2px} .goal b{font-family:var(--f-head);font-size:22px}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.packs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;white-space:normal;text-align:left;padding:10px 12px}
.packs button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--raised))}
.ext td{padding:3px 4px} .ext input,.ext select{padding:5px 6px}
.ext tr.slot td input,.ext tr.slot td select{background:transparent;border-style:dashed}
.ext tr.det td{background:var(--surface)} .ext tr.drag{opacity:.4} .ext tr.over td{box-shadow:inset 0 3px 0 var(--accent)}
.sugg{border:1px dashed var(--accent);border-radius:10px;padding:8px 12px;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tpls button{white-space:normal;text-align:left;display:flex;flex-direction:column;gap:5px;padding:12px;background:var(--bg)}
.tpls button:hover{border-color:var(--accent)}
button.pill{border:0;cursor:pointer}
@media (max-width:900px){.cw{grid-template-columns:minmax(0,1fr)} .side{position:static;flex-direction:row;overflow-x:auto} .ath{min-width:160px} .ex-h{grid-template-columns:24px 20px 1fr 1fr;} .ex-h>:nth-child(n+5){grid-column:span 2} .sets{padding-left:0}}
/* Athlet */
.page{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hd{padding:18px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-right,0px))}
.bd{flex:1;padding:6px max(16px,env(safe-area-inset-right,0px)) 100px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.bd>*{min-width:0}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--raised);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav div{display:grid;grid-template-columns:repeat(var(--n,4),1fr);width:100%;max-width:480px}
.nav button{border:0;border-radius:0;background:transparent;color:var(--muted);padding:13px 4px 15px;font-size:13px}
.nav button[aria-pressed="true"]{color:var(--accent);font-weight:600}
.big{display:flex;align-items:center;gap:8px}
.big input{flex:1;width:100%;font-size:26px;font-family:var(--f-head);text-align:center;padding:8px;font-weight:600}
.big button{width:50px;height:50px;font-size:22px;padding:0;border-radius:12px;flex:none}
.big b{flex:1;text-align:center;font-size:20px;font-family:var(--f-head)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:9px 12px;font-size:14px;border-radius:10px}
.chips button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,var(--raised));border-color:var(--accent);font-weight:600}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px} .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three input,.two input{width:100%;font-size:18px;padding:10px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.days button{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 10px;min-width:58px;font-size:12px}
.days button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--raised))}
.days .y{color:var(--good);font-size:11px;font-weight:600} .days .n{color:var(--muted);font-size:11px}
.msg{border-left:3px solid var(--accent);background:var(--raised);padding:10px 12px;border-radius:0 10px 10px 0}
.target{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.target div{background:var(--raised);border-radius:8px;padding:6px 2px} .target b{display:block;font-family:var(--f-head);font-size:16px}
.save{width:100%;padding:15px;font-size:16px;border-radius:12px}
.list{display:flex;flex-direction:column;gap:8px}
.list>div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.sess{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.sess summary{padding:12px;cursor:pointer;font-weight:600}
details.sess .list{padding:0 10px 10px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode button{padding:13px 8px;font-size:15px;border-radius:12px;white-space:normal}
.mode button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,var(--raised));border-color:var(--accent);font-weight:600}
.mt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.mt th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.mt th,.mt td{padding:3px 4px;text-align:right;border-bottom:1px solid var(--line)} .mt th:first-child,.mt td:first-child{text-align:left}
.mt tr.sum td{font-weight:600;border-bottom:0}
.exc{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.exc .no{width:28px;height:28px;border-radius:50%;background:var(--raised);display:grid;place-items:center;font-weight:600;font-family:var(--f-head)}
.exc .ss{font-family:var(--f-head);font-size:15px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.strip button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:11.5px;white-space:normal;text-align:center;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.strip button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--raised))}
.pgrid{display:flex;flex-direction:column;gap:10px}
.acols{display:flex;flex-direction:column;gap:16px}
.acols>*{min-width:0;display:flex;flex-direction:column;gap:16px}
/* Athlet am Laptop: breiter, Tabs oben, Eingabe und Woche nebeneinander */
@media (min-width:860px){
  .page{max-width:1080px}
  .nav{position:sticky;top:0;bottom:auto;order:-1;border-top:0;border-bottom:1px solid var(--line);background:var(--bg);padding-bottom:0}
  .nav div{max-width:1080px;grid-template-columns:repeat(var(--n,4),max-content);gap:4px;padding:0 max(16px,env(safe-area-inset-left,0px))}
  .nav button{padding:12px 16px;border-bottom:2px solid transparent;font-size:14px}
  .nav button[aria-pressed="true"]{border-bottom-color:var(--accent)}
  .bd{padding-bottom:48px}
  .acols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;align-items:start}
  .pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
}

/* ================= Design 2.2: aufgeräumter, mehr App ================= */
body{background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
.card{border-radius:var(--r);box-shadow:var(--shadow);background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 92%,#fff 3%),var(--surface));padding:18px}
h2{font-size:17px;letter-spacing:-.01em} h1{font-size:26px;letter-spacing:-.02em}
button{border-radius:10px;transition:background .15s,border-color .15s,transform .05s} button:active:not(:disabled){transform:translateY(1px)}
button.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 100%,#fff 12%),var(--accent));box-shadow:0 6px 16px -8px var(--accent)}
input,select,textarea{border-radius:9px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill{padding:3px 10px}
/* Kopf + Seitenleiste (Coach) */
.top{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px)}
.brand{display:inline-flex;align-items:center;gap:8px;font-size:17px;letter-spacing:-.01em}
.logo{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--ideal));color:var(--accent-ink)}
.logo .ico{width:16px;height:16px;stroke-width:2.4}
.ath{flex-direction:row;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:transparent;border-color:transparent}
.ath:hover:not(:disabled){background:var(--surface);border-color:var(--line)}
.ath[aria-pressed="true"]{background:var(--surface);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:var(--shadow)}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--f-head);font-size:13px;background:color-mix(in srgb,var(--s,var(--none)) 18%,var(--raised));color:var(--fg);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--s,var(--none)) 70%,transparent)}
.ai{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1} .ai b{overflow:hidden;text-overflow:ellipsis}
.tabs{gap:4px;border-bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;width:fit-content;max-width:100%}
.tabs button{border:0;border-radius:9px;padding:7px 13px;font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--raised);color:var(--fg);box-shadow:0 1px 0 rgb(255 255 255 / .05) inset,0 2px 8px -2px rgb(0 0 0 / .5)}
.tsep{align-self:stretch;margin:6px 4px}
/* Woche: Kopfzeile, große Karten, Balken */
.wkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wkbar>div{display:flex;flex-direction:column}
.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.hc{display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}

}

      ${c2(i.steps, s.steps)}${c2(i.cardio, s.cardio)}<td${J(i.sleep, s.sleep)}><span class="two-l"><b>${hm(i.sleep)}</b><span class="muted">${hm(s.sleep)}</span></span></td><td${J(i.training, s.training)}><span class="two-l"><b>${i.training === null ? '–' : i.training}</b><span class="muted">${N(s.training, 1)}</span></span></td></tr>`; }

/* ---------- Ziel & Plan ---------- */

function endText(b, pl) {

  if (r) return 'Zielgewicht vsl. in der Woche ab ' + dmy(r.date) + ' erreicht → endet ' + dmy(e) + ', danach Erhalt';
  if (b.end === 'ziel' && C.dirSign(b.typ)) return e ? 'Zielgewicht wird bis ' + dmy(e) + ' nicht erreicht' : 'Zielgewicht liegt über 2 Jahre entfernt';
  if (e) return 'endet ' + dmy(e);

}
function blockCard(p, days, pl, b) {

      ${endV === 'datum' ? `<input type="date" id="b-bis-${id}" data-c="blk" data-id="${id}" data-f="bis" data-t="date" value="${b.bis || ''}" aria-label="Ende am">` : ''}
      ${endV === 'ziel' ? `<label class="row small">bei <input class="w-xs" id="b-tg-${id}" inputmode="decimal" data-c="blk" data-id="${id}" data-f="target" data-t="num" value="${esc(val(b.target))}" placeholder="${NV(P(p.athlete.targetWeight), 1)}" title="leer = Zielgewicht des Athleten"> kg</label>` : ''}</div>

    <div class="row"><label class="row small">Schritte/Tag <input class="w-s" id="b-st-${id}" inputmode="numeric" data-c="blk" data-id="${id}" data-f="steps" data-t="num" value="${esc(val(b.steps))}"></label>

function tabPlan() {
  const { p, days, pl, ideals, kNow } = ctx(), a = p.athlete, gi = goalInfo(p, pl, days), mt = C.maintenance(p);
  const bs = C.blocks(p), autos = [];
  bs.forEach((b, i) => { const e = pl.ends[b.id], nx = bs[i + 1]; if (e && (!nx || nx.von > add(e, 1)) && b.typ !== 'Erhalt') autos.push({ t: 'a', d: add(e, 1), o: b, nx: nx }); });
  const rank = { b: 0, p: 1, a: 2 };
  const items = bs.map(b => ({ t: 'b', d: b.von, o: b })).concat((p.pauses || []).map(x => ({ t: 'p', d: x.von || '9999', o: x })), autos)

function exRow(s, e, ei, ms) {
  const sm = C.exSummary(e), mi = ms.indexOf(e.muscle), k = `data-s="${s.id}" data-id="${e.id}"`, open = !!CS.open[e.id];
  const more = !!(e.name || e.kad || e.note);   // Kadenz und Ausführung stehen in einer eigenen Zeile – so bleibt lange Notiz lesbar
  const head = `<tr class="${e.name ? '' : 'slot'}${more ? ' hasub' : ''}" draggable="true" style="vertical-align:top" data-ex="${e.id}" data-s="${s.id}"><td class="handle" title="Ziehen zum Verschieben">${ico('grip')}</td><td class="muted">${ei + 1}</td>
    <td><select class="w-m" id="x-m-${e.id}" data-c="ex" ${k} data-f="muscle" aria-label="Muskel"><option value=""></option>${ms.map(m => `<option ${m === e.muscle ? 'selected' : ''}>${esc(m)}</option>`).join('')}${e.muscle && mi < 0 ? `<option selected>${esc(e.muscle)}</option>` : ''}</select></td>
    <td><input class="grow" style="min-width:190px" id="x-n-${e.id}" ${mi >= 0 ? `list="dlx-${mi}"` : ''} data-c="ex" ${k} data-f="name" value="${esc(e.name)}" placeholder="Übung" aria-label="Übung"></td>
    ${sm.uniform ? `<td><input class="w-xs" id="x-c-${e.id}" inputmode="numeric" data-c="exc" ${k} data-f="n" value="${sm.n}" aria-label="Sätze"></td>
      <td><input class="w-xs" id="x-r-${e.id}" data-c="exc" ${k} data-f="reps" value="${esc(sm.reps)}" placeholder="6-10" aria-label="Wiederholungen"></td>
      <td><input class="w-xs" id="x-i-${e.id}" data-c="exc" ${k} data-f="rir" value="${esc(sm.rir)}" placeholder="1→0" aria-label="RIR"></td>
      <td><select class="w-m" id="x-t-${e.id}" data-c="exc" ${k} data-f="type" aria-label="Satzart">${C.SATZ.map(z => `<option ${z === sm.type ? 'selected' : ''}>${z}</option>`).join('')}</select></td>`
    : `<td colspan="4"><button class="ic ghost" data-a="exOpen" ${k}>${sm.n} Sätze einzeln ${open ? '▴' : '▾'}</button></td>`}
    <td><span class="row" style="gap:2px;flex-wrap:nowrap;justify-content:flex-end"><button class="ic ghost" data-a="exOpen" ${k} title="Sätze einzeln bearbeiten" aria-label="Sätze einzeln">${ico('more')}</button><button class="ic ghost" data-a="exMove" ${k} data-d="-1" aria-label="nach oben">${ico('up')}</button><button class="ic ghost" data-a="exMove" ${k} data-d="1" aria-label="nach unten">${ico('down')}</button><button class="ic ghost" data-a="dupEx" ${k} title="Duplizieren" aria-label="Duplizieren">${ico('copy')}</button><button class="ic ghost danger" data-a="delEx" ${k} aria-label="Übung löschen">${ico('x')}</button></span></td></tr>`
    + (more ? `<tr class="sub" data-ex="${e.id}" data-s="${s.id}"><td></td><td></td><td><textarea class="grow" rows="1" id="x-k-${e.id}" data-c="ex" ${k} data-f="kad" placeholder="Kadenz" aria-label="Kadenz">${esc(e.kad || '')}</textarea></td>
      <td colspan="6"><textarea class="grow" rows="1" id="x-o-${e.id}" data-c="ex" ${k} data-f="note" placeholder="Notiz / Ausführung – das sieht der Athlet unter der Übung" aria-label="Notiz">${esc(e.note || '')}</textarea></td></tr>` : '');
  if (!open) return head;
  return head + `<tr class="det"><td></td><td colspan="8"><div class="sets"><span class="lbl">Satz</span><span class="lbl">Wdh.</span><span class="lbl">Satzart</span><span class="lbl">RIR</span><span></span>
    ${(e.sets || []).map((st, i) => `<span class="small muted">${i + 1}</span><input id="st-r-${e.id}-${i}" data-c="set" ${k} data-n="${i}" data-f="reps" value="${esc(st.reps || '')}" aria-label="Wiederholungen Satz ${i + 1}">
      <select id="st-t-${e.id}-${i}" data-c="set" ${k} data-n="${i}" data-f="type" aria-label="Satzart Satz ${i + 1}">${C.SATZ.map(z => `<option ${z === (st.type || 'Straight Set') ? 'selected' : ''}>${z}</option>`).join('')}</select>
      <input id="st-i-${e.id}-${i}" data-c="set" ${k} data-n="${i}" data-f="rir" value="${esc(st.rir === undefined ? '' : st.rir)}" aria-label="RIR Satz ${i + 1}">
      <span>${(e.sets || []).length > 1 ? `<button class="ic ghost" data-a="delSet" ${k} data-n="${i}" aria-label="Satz löschen">${ico('x')}</button>` : ''}</span>`).join('')}</div>
    <div class="row"><button class="ic" data-a="addSet" ${k}>+ Satz</button>${(e.sets || []).length > 1 ? `<button class="ic ghost" data-a="setAll" ${k}>Satz 1 auf alle übertragen</button>` : ''}</div></td></tr>`;
}

/* ---------- Fenster: neuer Athlet, Übernahme, Split ---------- */
function modalView() {

      <label class="fld"><span class="lbl">Größe cm</span><input id="m-height" inputmode="numeric" maxlength="3" data-in="nw" data-f="height" value="${esc(nw.height)}"></label>

      ${pk.m.monitoring ? `<label class="fld"><span class="lbl">Zielgewicht kg</span><input id="m-tw" inputmode="decimal" data-in="nw" data-f="tw" value="${esc(nw.tw)}" placeholder="leer = halten"></label>` : ''}

    ${P(nw.kcal) === null ? `<div class="stack" style="gap:6px"><span class="lbl">Aktivität im Alltag</span><div class="chips">${C.ACT.map(x => `<button data-a="nwAct" data-v="${x.k}" aria-pressed="${nw.act === x.k}">${x.t}</button>`).join('')}</div></div>` : ''}

      ${pk.m.monitoring && dir ? `<br>Start: Block „${dir}“ ab heute${dir !== 'Erhalt' ? ' mit ' + (dir === 'Diät' ? '0,5' : '0,25') + ' %/Woche bis zum Zielgewicht, danach automatisch Erhalt' : ''}. Alles später änderbar.` : ''}</div>` : ''}

      return `<button data-a="copyTo" data-v="${a.id}|${o || ''}"><b>${esc(a.name)}</b> <span class="small muted">${b ? '→ in „' + esc(b.name || b.typ) + '“' : '→ als Ernährungsplan'}</span></button>`; }).join('');
    return `<div class="ov"><div class="card modal stack" role="dialog" aria-label="Kopieren"><h2>„${esc(src.name)}“ kopieren</h2>

  if (CS.modal === 'tplSave' && CS.tplS && CS.cur) {

  const mt = C.planTotals({ meals: [m] }, AS.fmap), items = (m.items || []).filter(it => AS.fmap[it.food]);
  return `<div class="mcard"><div class="mch"><span class="mno">${i + 1}</span><div class="stack" style="gap:1px;flex:1;min-width:0"><span class="lbl">Mahlzeit ${i + 1}</span><b class="wrap-txt">${esc(m.name)}</b></div>
      <div class="mk"><b>${N(mt.kcal)}</b><span>kcal</span></div></div>
    <div class="fl">${items.map(it => { const f = AS.fmap[it.food], v = C.itemValues(it, AS.fmap);
      return `<div class="fi"><div class="fn"><span class="wrap-txt">${esc(f.name)}</span><span class="fm">P ${N(v.p)} · KH ${N(v.kh)} · F ${N(v.f)}</span></div><b class="fg">${N(P(it.g))} g</b></div>`; }).join('') || '<div class="small muted">Noch keine Lebensmittel.</div>'}</div>
    <div class="mfoot"><span>P <b>${N(mt.p)}</b></span><span>KH <b>${N(mt.kh)}</b></span><span>F <b>${N(mt.f)}</b></span></div></div>`;
}
/** Kopf eines Ernährungstags: kcal groß, Makros als Balken (Anteil an den kcal). */
function dayHero(name, sub, v) {
  const kc = v.kcal || 0, sh = k => kc ? Math.round((k === 'f' ? 9 : 4) * (v[k] || 0) / kc * 100) : 0;
  return `<div class="card dhero"><div class="row"><div class="stack" style="gap:2px"><span class="lbl">${sub}</span><h2 style="font-size:22px">${esc(name)}</h2></div><span class="sp"></span><div class="mk big"><b>${N(kc)}</b><span>kcal</span></div></div>
    <div class="mbar"><i class="p" style="width:${sh('p')}%"></i><i class="kh" style="width:${sh('kh')}%"></i><i class="f" style="width:${sh('f')}%"></i></div>
    <div class="mleg"><span><i class="p"></i>Protein <b>${N(v.p)} g</b></span><span><i class="kh"></i>Kohlenhydrate <b>${N(v.kh)} g</b></span><span><i class="f"></i>Fett <b>${N(v.f)} g</b></span></div></div>`;
}
function aFood() {
  const p = ap(), w = p.modules.monitoring ? aOwner(p) : null, nds = w && w.o ? C.ndaysOf(p, w.o.id) : [];
  const anyLinked = {}; (p.ndays || []).forEach(n => { if (n.planId) anyLinked[n.planId] = 1; });
  const free = (p.plans || []).filter(pl => !anyLinked[pl.id] || !p.modules.monitoring);
  const views = nds.map(n => { const pl = n.source === 'plan' ? (p.plans || []).find(x => x.id === n.planId) : null; return { id: n.id, name: n.name, sub: N(P(n.days)) + '× pro Woche', v: C.ndayValues(p, n, AS.fmap), meals: pl ? pl.meals || [] : null }; })
    .concat(free.map(pl => ({ id: pl.id, name: pl.name, sub: 'Ernährungsplan', v: C.planTotals(pl, AS.fmap), meals: pl.meals || [] })));
  if (!views.length) { const t = p.modules.monitoring ? C.dayTarget(p, TODAY, '', AS.fmap, AS.pl) : null; return t ? dayHero('Deine Vorgabe', 'pro Tag', t) : '<div class="card muted">Dein Coach hat noch keinen Ernährungsplan hinterlegt.</div>'; }
  const todayTt = (C.dayMap(AS.b.days)[TODAY] || {}).tt, sel = views.find(x => x.id === AS.fsel) || views.find(x => x.name === todayTt) || views[0];
  return `${w && w.from ? `<div class="msg">Dein Plan gilt ab ${fd(w.from)} – du kannst ihn dir schon anschauen.</div>` : ''}
    ${views.length > 1 ? `<div class="seg big-seg" role="group">${views.map(x => `<button data-a="fsel" data-v="${x.id}" aria-pressed="${x === sel}">${esc(x.name)}</button>`).join('')}</div>` : ''}
    ${dayHero(sel.name, sel.sub, sel.v)}
    ${sel.meals ? `<div class="pgrid">${sel.meals.map(mealTable).join('')}</div>` : '<div class="card small muted">Freie Lebensmittelwahl – Hauptsache, die Makros passen.</div>'}`;
}
function exCard(e, i) {
  const sm = C.exSummary(e), rir = sm.rir !== null && sm.rir !== '' ? 'RIR ' + esc(sm.rir).replace('→', ' → ') : '';
  const sets = sm.uniform ? `<div class="ss">${sm.n} ${sm.n === 1 ? 'Satz' : 'Sätze'} · ${esc(sm.reps || '–')} Wdh.${rir ? ' · ' + rir : ''}${sm.type !== 'Straight Set' ? ' · ' + esc(sm.type) : ''}</div>`
    : `<div class="ss">${(e.sets || []).map((st, j) => `Satz ${j + 1}: ${esc(st.reps || '–')} Wdh.${st.rir !== '' && st.rir !== undefined ? ' · RIR ' + esc(st.rir) : ''}${st.type && st.type !== 'Straight Set' ? ' · ' + esc(st.type) : ''}`).join('<br>')}</div>`;
  return `<div class="exc"><span class="no">${i + 1}</span><div class="stack" style="gap:3px"><div class="row" style="gap:8px"><b>${esc(e.name)}</b>${e.muscle ? `<span class="pill s-acc">${esc(e.muscle)}</span>` : ''}</div>${sets}
    ${e.kad ? `<div class="small muted pre wrap-txt">Kadenz: ${esc(e.kad)}</div>` : ''}${e.note ? `<div class="small pre wrap-txt" style="border-left:2px solid var(--line);padding-left:8px">${esc(e.note)}</div>` : ''}</div></div>`;
}
function aTrain() {
  const p = ap(), t = p.training || {}, L = Math.max(1, P(t.length) || 7), ss = (t.sessions || []).filter(s => C.named(s).length);
  if (!ss.length) return '<div class="card muted">Dein Coach hat noch keinen Trainingsplan hinterlegt.</div>';
  const sel = AS.trSel || { d: TODAY }, cur = sel.s ? C.sessionById(p, sel.s) : C.plannedSession(p, sel.d);
  const cTxt = c => c ? (c.min ? N(c.min) + ' min' : '') + (c.min && c.art ? ' ' : '') + esc(c.art) : '';
  let strip = ''; for (let i = 0; i < 7; i++) { const d = add(TODAY, i), s = C.plannedSession(p, d), c = C.plannedCardio(p, d);
    strip += `<button data-a="trDay" data-v="${d}" aria-pressed="${!sel.s && sel.d === d}"><span class="muted">${i === 0 ? 'Heute' : WD[C.wd(d)]}</span><b>${s ? esc(s.name) : c ? 'Cardio' : 'Rest'}</b>${c && s ? `<span class="small okc">+ ${cTxt(c)}</span>` : c ? `<span class="small okc">${cTxt(c)}</span>` : ''}</button>`; }
  const dc = sel.s ? null : C.plannedCardio(p, sel.d);
  const title = sel.s ? esc(cur.name) : (sel.d === TODAY ? 'Heute' : fd(sel.d)) + ': ' + (cur ? esc(cur.name) : dc ? 'Cardio' : 'Rest');
  const ow = p.modules.monitoring ? aOwner(p) : null, ct = cardioText(ow && ow.o);
  return `<div class="strip">${strip}</div>
    ${ct ? `<div class="msg"><span class="lbl">Cardio</span> ${ct}${ow.o && P(ow.o.steps) ? ' · Schritte ' + N(P(ow.o.steps)) + ' pro Tag' : ''}</div>` : ''}
    <div class="row"><h2>${title}</h2>${cur ? `<span class="small muted">${C.named(cur).length} Übungen · ${C.setCount(cur)} Sätze</span>` : ''}</div>
    ${dc ? `<div class="card row" style="gap:10px">${ico('pulse')}<div class="stack" style="gap:2px"><span class="lbl">Cardio${cur ? ' zusätzlich' : ''}</span><b>${cTxt(dc)}</b></div></div>` : ''}
    ${cur ? `<div class="pgrid">${C.named(cur).map(exCard).join('')}</div>` : dc ? '' : '<div class="card small muted">Rest – Erholung, Schritte und Ernährung laut Plan.</div>'}
    <div class="stack" style="gap:6px"><span class="lbl">Alle Sessions</span><div class="chips">${ss.map(s => `<button data-a="trSess" data-v="${s.id}" aria-pressed="${sel.s === s.id}">${esc(s.name)}</button>`).join('')}</div></div>
    <div class="small muted">Gewichte und Wiederholungen trägst du wie gewohnt in deinem Trainings-Log ein.${L !== 7 ? ' Dein Zyklus dauert ' + L + ' Tage.' : ''}</div>`;
}
function aHist() {
  const p = ap(), days = AS.b.days, kNow = p.athlete.start ? Math.max(0, C.weekOf(p, TODAY)) : 0;
  const recent = days.slice(-21).reverse();
  return `<div class="card stack"><h2>Gewicht je Woche</h2>${chartWeeks(p, days, AS.pl.ideals, kNow, 260)}</div>
    <div class="card stack"><h2>Letzte Einträge</h2><div class="elist">
    ${recent.map(x => { const kc = P(x.p) !== null || P(x.kh) !== null || P(x.f) !== null ? N(C.kcalOf(x.p, x.kh, x.f)) + ' kcal' + (x.src === 'plan' ? ' ✓' : '') : '';
      const sub = [kc, P(x.steps) !== null ? N(P(x.steps)) + ' Schritte' : '', P(x.cardio) ? N(P(x.cardio)) + ' min Cardio' : '', esc(x.tr || '')].filter(Boolean).join(' · ');
      return `<div class="er"><div class="fn"><b>${fd(x.date)}</b>${sub ? `<span class="fm">${sub}</span>` : ''}</div><b class="fg">${P(x.w) !== null ? NW(P(x.w)) + ' kg' : '<span class="muted">–</span>'}</b></div>`; }).join('') || '<div class="small muted">Noch keine Einträge.</div>'}
    </div></div>`;
}
function aAct(a, v) {
  const d = AS.b && AS.tab === 'heute' ? draft() : null;
  switch (a) {
    case 'tab': AS.tab = v; aRender(); window.scrollTo(0, 0); return;
    case 'fsel': AS.fsel = v; return aRender();
    case 'ak': { const p = ap(), ws = C.weekStart(p, +v), we = add(ws, 6); AS.ak = +v; AS.date = we < TODAY ? we : TODAY; AS.draft = null; AS.err = ''; AS.edit = false; AS.restored = false; return aRender(); }
    case 'date': AS.date = v; AS.draft = null; AS.err = ''; AS.edit = false; AS.restored = false; return aRender();
    case 'edit': AS.edit = true; return aRender();
    case 'msgs': AS.msgs = !AS.msgs; return aRender();
    case 'ckOpen': { const due = ckDue(ap()), cur = due && (AS.b.weeks[due.ws] || {}).check; if (!due) return; AS.ck = { ws: due.ws, s: Object.assign({}, cur && cur.s), t: Object.assign({}, cur && cur.t) }; return aRender(); }
    case 'ckClose': AS.ck = null; return aRender();
    case 'ckS': { const [q, n] = v.split(':'); AS.ck.s[q] = +n; return aRender(); }
    case 'ckSave': { const ck = AS.ck; AS.ckBusy = true; aRender();
      return call('a.saveCheck', { week: ck.ws, check: { s: ck.s, t: ck.t } }).then(r => { setBundle(r); AS.ckBusy = false; AS.ck = null; aRender(); toast('Check-in gesendet ✓'); })
        .catch(er => { AS.ckBusy = false; aRender(); toast(er.message); }); }
    case 'tt': d.tt = d.tt === v ? '' : v; AS.err = ''; touch(d); return aRender();
    case 'tr': d.tr = v; touch(d); return aRender();
    case 'mode': d.mode = v; AS.err = ''; touch(d); return aRender();
    case 'wStep': { const cur = P(d.w) !== null ? P(d.w) : d.last; if (cur === null) return; d.w = val(Math.round((cur + Number(v)) * 100) / 100); touch(d); return aRender(); }
    case 'slStep': d.sleep = Math.max(0, Math.min(16, (d.sleep === null ? 7.5 : d.sleep) + Number(v))); touch(d); return aRender();
    case 'wkSel': AS.wk = +v; AS.wd = null; return aRender();
    case 'trDay': AS.trSel = { d: v }; return aRender();
    case 'trSess': AS.trSel = { s: v }; return aRender();
    case 'wkSave': { const p = ap(), ws = C.weekStart(p, Math.max(0, Math.max(0, C.weekOf(p, TODAY)) + AS.wk));
      AS.wbusy = true; aRender();
      return call('a.saveWeek', { week: ws, entry: { steps: numIn(AS.wd.steps), sleep: hIn(AS.wd.sleep) } }).then(r => { setBundle(r); AS.wbusy = false; AS.wd = null; aRender(); toast('Wochenwerte gespeichert ✓'); })
        .catch(er => { AS.wbusy = false; aRender(); toast(er.message); }); }
    case 'save': {
      const p = ap(), m = p.modules, e = { tt: d.tt, p: '', kh: '', f: '', w: d.w, steps: numIn(d.steps), cardio: d.cardio, sleep: d.sleep, tr: d.tr, note: d.note, src: '' };
      if (m.nutrition) {
        if (d.mode === 'plan') { const nds = C.ndaysAt(p, AS.date, AS.pl); if (nds.length > 1 && !d.tt) { AS.err = 'Bitte zuerst den Tagtyp wählen.'; return aRender(); }
          const tgt = C.dayTarget(p, AS.date, d.tt, AS.fmap, AS.pl); if (!tgt) { AS.err = 'Für diesen Tag gibt es noch keine Vorgabe – bitte „Abgewichen“ wählen.'; return aRender(); }
          e.p = Math.round(tgt.p); e.kh = Math.round(tgt.kh); e.f = Math.round(tgt.f); e.src = 'plan'; }
        else if (d.mode === 'frei') { e.p = d.p; e.kh = d.kh; e.f = d.f; }
      } else { e.p = d.p; e.kh = d.kh; e.f = d.f; }
      if (p.athlete.weekly) { e.steps = ''; e.sleep = null; }
      for (const k of ['p', 'kh', 'f', 'w', 'steps', 'cardio']) if (String(e[k] === null ? '' : e[k]).trim() !== '' && P(e[k]) === null) { AS.err = 'Bitte nur Zahlen eintragen.'; return aRender(); }
      const w = P(e.w); if (w !== null && (w < 30 || w > 300)) { AS.err = 'Bitte ein realistisches Gewicht eintragen, z. B. ' + NW(d.last) + '.'; return aRender(); }
      AS.busy = true; AS.err = ''; aRender();
      return call('a.save', { date: AS.date, entry: e }).then(r => { setBundle(r); store.set(null); AS.busy = false; AS.draft = null; AS.edit = false; AS.restored = false; AS.retry = false; aRender(); window.scrollTo(0, 0); toast('Gespeichert ✓'); })
        .catch(er => { AS.busy = false; AS.retry = er.code === 'net'; AS.err = er.message + (AS.retry ? ' Dein Eintrag bleibt auf dem Handy und wird gesendet, sobald du wieder Netz hast.' : ''); aRender(); });
    }
  }
}

/* ---------- Start ---------- */
if (BOOT && BOOT.web && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (BOOT && BOOT.web && BOOT.mode === 'none') {
  root.innerHTML = `<div class="center"><div class="stack card" style="max-width:420px;text-align:left"><h1>Willkommen</h1><p class="muted">Füge hier deinen persönlichen Link von deinem Coach ein (einmalig).</p>
    <input id="lk" placeholder="Link einfügen" autocomplete="off"><button class="pri" id="lk-go">Öffnen</button><p class="small muted" id="lk-e"></p></div></div>`;
  document.getElementById('lk-go').onclick = () => { const s = document.getElementById('lk').value, m = s.match(/[?#&](k|coach)=([A-Za-z0-9_-]+)/);

else if (!BOOT || BOOT.mode === 'none') fatal('Bitte öffne die App über deinen persönlichen Link.');
else if (BOOT.mode === 'setup') root.innerHTML = `<div class="center"><div class="stack card" style="max-width:520px;text-align:left"><h1>Dein Coach-Link</h1><p class="muted">Diesen Link als Lesezeichen speichern – er ist dein Zugang. Wer ihn hat, kann alles sehen und ändern.</p><input readonly value="${esc(BOOT.url + '?coach=' + BOOT.key)}" onclick="this.select()"><a href="${esc(BOOT.url + '?coach=' + BOOT.key)}" target="_top"><button class="pri">Coach-Ansicht öffnen</button></a></div></div>`;
